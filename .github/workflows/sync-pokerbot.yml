name: Sync pokerbot

# Moves vendor/pokerbot to the latest pokerbot main, checks every bot can play,
# then pushes. The push is what makes Vercel redeploy the site.
on:
  schedule:
    - cron: '17 * * * *'          # hourly
  workflow_dispatch:              # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [pokerbot-updated]     # sent by pokerbot on push, if it is set up to

permissions:
  contents: write

concurrency:
  group: sync-pokerbot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Move vendor/pokerbot to pokerbot main
        id: bump
        run: |
          before=$(git -C vendor/pokerbot rev-parse HEAD)
          git submodule update --remote vendor/pokerbot
          after=$(git -C vendor/pokerbot rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pokerbot is already at $after"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C vendor/pokerbot log --oneline "$before..$after"
          fi

      - uses: actions/setup-python@v5
        if: steps.bump.outputs.changed == 'true'
        with:
          python-version-file: .python-version

      - name: Check every bot can play
        if: steps.bump.outputs.changed == 'true'
        run: python smoke_test.py

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          after=${{ steps.bump.outputs.after }}
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add vendor/pokerbot
          git commit -m "Update pokerbot to ${after:0:7}" \
            -m "$(git -C vendor/pokerbot log --format='- %s' ${{ steps.bump.outputs.before }}..$after)"
          git push
